# Kitty theme: Neon Synthwave. Deployed via setup/ (module "kitty") or the hub app's kitty theme
# picker into ~/.kitty.local.conf. See themes/kitty/README.md.
background #0d0221
foreground #ede7f6
cursor #ff2fd4
cursor_text_color #0d0221
selection_background #ff2fd4
selection_foreground #0d0221
url_color #00f0ff
color0  #1a0b2e
color8  #4a2d6b
color1  #ff2f6e
color9  #ff5c8a
color2  #00ffb3
color10 #5affce
color3  #ffe066
color11 #fff59d
color4  #00d4ff
color12 #5ce1ff
color5  #ff2fd4
color13 #ff8ae2
color6  #00f0ff
color14 #7df9ff
color7  #e0d7f5
color15 #ffffff

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #ff2fd4
active_tab_foreground #0d0221
active_tab_font_style bold
inactive_tab_background #2d1854
inactive_tab_foreground #b494e0
tab_bar_background #0d0221
tab_title_template " {fmt.fg._00f0ff}{index}{fmt.fg.tab} {title} "
