# kitty config. Deployed to ~/.config/kitty/kitty.conf by setup/ (module "kitty").
# Trial terminal, side-by-side with Hyper -- see README.md. Native graphics protocol is on by
# default (no config needed); it does NOT support sixel and never will (kitty's own choice, not
# a gap -- its protocol is the more capable one). Docs: https://sw.kovidgoyal.net/kitty/conf/

font_family      __FONT_FAMILY__
font_size        13.0

cursor_shape     block
# Filled block while this window has keyboard focus, hollow outline while it doesn't -- matches
# tmux's own active/inactive-pane cursor behavior (tmux does this on its own; kitty needs this set
# explicitly for the same effect outside tmux). "hollow" is already kitty's own default, but that's
# an easy thing for a future kitty version -- or a theme -- to quietly change; pinned here on
# purpose so it's not relying on an undocumented default.
cursor_shape_unfocused hollow
cursor_blink_interval 0

scrollback_lines 10000
copy_on_select   no
mouse_map        left click ungrabbed  mouse_click_url_or_select

enable_audio_bell no

shell            __ZSH__
# no-cursor: keep every other shell-integration feature (jump-to-prompt, cwd tracking, etc.) but
# stop it from switching the cursor to a beam at the prompt -- that fights cursor_shape (block)
# above and is why a fresh kitty window's prompt didn't actually show a solid block despite it
# being set. Confirmed for real: a plain "enabled" kitty window showed a thin beam at the prompt,
# not the configured block, until this was added.
shell_integration no-cursor

macos_option_as_alt yes
confirm_os_window_close 0

# Machine-/work-specific tweaks (colors, keybindings, etc.) -- untracked, optional.
# `include` (not `globinclude`, which is only for glob patterns relative to this file's own
# directory and rejects home/absolute paths -- confirmed the hard way: "non-relative patterns
# are unsupported"); ${HOME} matches kitty's own docs ("environment variables are expanded"),
# not relying on unconfirmed `~` handling. Fine if the file doesn't exist.
include ${HOME}/.kitty.local.conf
