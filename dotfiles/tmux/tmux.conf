# tmux config. Sourced from ~/.tmux.conf by setup/ (block: terminal-stuff:tmux).
# Needs tmux >= 3.2 (copy-command). Machine-/work-specific tweaks go in ~/.tmux.local.conf (untracked).

# ---------------------------------------------------------------- basics
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
# Lets apps tell Shift+Enter/Ctrl+Enter etc. apart from plain Enter (pi warns without it). Needs tmux >= 3.2.
set -g extended-keys on
setw -g mode-keys vi

# New windows/panes get zsh (matches kitty), not whatever $SHELL/passwd falls back to (often
# bash) -- see set-default-shell.sh for why this re-resolves zsh's path on every tmux start.
run-shell '#{@terminal-stuff-repo}/dotfiles/tmux/set-default-shell.sh'

# reload config
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# ---------------------------------------------------------------- terminal / colors
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# Sixel image passthrough: lets a program (e.g. chafa, img2sixel) draw an image in the *outer*
# terminal even though it's running inside tmux. Needs tmux built with --enable-sixel (check:
# `tmux display -p '#{sixel_support}'` -> 1; Homebrew's tmux has this, distro packages vary) AND
# an outer terminal that can actually render sixel (Hyper's stable release can't -- see the
# "hyper-install" step's canary build; kitty deliberately never will -- it has its own protocol
# instead). Off by default until 3.4.1: `allow-passthrough` lets any program write straight to the
# outer terminal, a minor consideration on a shared/multi-user box, fine for a personal machine.
set -g allow-passthrough on
set -ga terminal-features ',*:sixel'

# ---------------------------------------------------------------- theme (tmux2k)
#set -g @tmux2k-icons-only true
set -g @tmux2k-theme 'onedark'

# Status bar segments (left/right), from config.jsonc's tmux.statusLeft/statusRight -- edit via
# the hub app's Status Segments tab, or by hand (config/README.md). Must run before tpm's `run`
# line below loads tmux2k. See apply-status-segments.sh for why this has to happen here and not
# only in the hub's "apply live" button: that only patches the currently-running server, and is
# lost the next time tmux itself (re)starts, which is what re-sources this whole file.
run-shell '#{@terminal-stuff-repo}/dotfiles/tmux/apply-status-segments.sh "#{@terminal-stuff-repo}"'

# ---------------------------------------------------------------- mouse
# Toggle mouse with ^B m
bind m \
  if-shell -F "#{mouse}" \
    "set-option -g mouse off \; display-message 'Mouse: OFF'" \
    "set-option -g mouse on \; display-message 'Mouse: ON'"

# Fix: Keep selection visible after mouse drag AND copy to the system clipboard.
# copy-pipe-no-clear with no argument pipes into copy-command, which picks whichever
# clipboard tool this machine has (macOS pbcopy, Wayland wl-copy, X11 xclip/xsel, WSL clip.exe).
set -ga update-environment ' WAYLAND_DISPLAY XDG_SESSION_TYPE'
set -s copy-command 'if [ "$(uname)" = Darwin ]; then pbcopy; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# Fix: Disable tmux's default right-click context menu (conflicts with Hyper.js native context menu)
unbind -n MouseDown3Pane
unbind -T copy-mode MouseDown3Pane
unbind -T copy-mode-vi MouseDown3Pane

# Shift + right-click: show tmux context menu
bind -n S-MouseDown3Pane display-menu -O -t = -xM -yM \
    "Split Right"  h "split-window -h -c '#{pane_current_path}'" \
    "Split Down"   v "split-window -v -c '#{pane_current_path}'" \
    "" \
    "Swap Up"      u "swap-pane -U" \
    "Swap Down"    d "swap-pane -D" \
    "" \
    "New Window"   n "new-window -c '#{pane_current_path}'" \
    "Kill Pane"    x "confirm-before -p 'Kill pane? (y/n)' kill-pane" \
    "Kill Window"  X "confirm-before -p 'Kill window? (y/n)' kill-window"

# ---------------------------------------------------------------- local overrides (untracked, optional)
source-file -q ~/.tmux.local.conf

# ---------------------------------------------------------------- plugins (tpm; `prefix + I` installs)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'alexwforsythe/tmux-which-key'     # prefix + Space

# Initialize the plugin manager (keep at the very bottom)
if "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
